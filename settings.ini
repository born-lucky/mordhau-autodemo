; Mordhau Auto Demo settings. Restart the tool after changing these.

; Demo names start with this: auto_20260929_140312_skm_mashpit
Prefix = auto

; Seconds to wait after a map loads before starting the demo
StartDelay = 3

; Delete the OLDEST auto demos once they use more than this many GB (0 = never).
; Only files starting with the prefix above are ever deleted. A match is ~15-30 MB.
MaxGB = 10

; Recording rate. 0 = game default. 120 = sharper timing, bigger files.
RecordHz = 0

; Your console key. Blank = read it from Mordhau's settings automatically.
; Examples: Tilde, Caret, F10, Insert
ConsoleKey =

; 1 = play a short sound when a recording starts
Beep = 0

; Only type after this many milliseconds with no key or mouse button held,
; so the command never mixes with what you are pressing. Raise it if it still does.
QuietMs = 1200

; 1 = also record offline / practice / bot games (0 = online servers only)
RecordOffline = 1
